{% extends "base.html" %}

{% block title %}Add Skill Request - LearnMate{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2><i class="fas fa-search-plus"></i> Request a Skill to Learn</h2>
        <form method="POST" action="{{ url_for('add_request') }}">
            <div class="form-group">
                <label for="skill_name"><i class="fas fa-search"></i> What skill do you want to learn? *</label>
                <input type="text" class="form-control" id="skill_name" name="skill_name" 
                       placeholder="e.g., Java Programming, Guitar, Photography" required>
            </div>
            
            <div class="form-group">
                <label for="category"><i class="fas fa-folder"></i> Category *</label>
                <select class="form-control" id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option value="Programming">Programming</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Design">Design</option>
                    <option value="Languages">Languages</option>
                    <option value="Music">Music</option>
                    <option value="Arts">Arts</option>
                    <option value="Mathematics">Mathematics</option>
                    <option value="Science">Science</option>
                    <option value="Writing">Writing</option>
                    <option value="Business">Business</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="description"><i class="fas fa-align-left"></i> Why do you want to learn this?</label>
                <textarea class="form-control" id="description" name="description" rows="4"
                          placeholder="Explain your learning goals, what aspects you're most interested in, etc."></textarea>
            </div>
            
            <div class="form-group">
                <label for="urgency"><i class="fas fa-exclamation-circle"></i> Urgency</label>
                <select class="form-control" id="urgency" name="urgency">
                    <option value="">Select Urgency</option>
                    <option value="Low">Low - Learning for fun</option>
                    <option value="Medium">Medium - Want to learn soon</option>
                    <option value="High">High - Need it for a project/exam</option>
                    <option value="Urgent">Urgent - Need immediately</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-info" style="width: 100%; padding: 15px;">
                <i class="fas fa-plus"></i> Add Request
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px;">
            <a href="{{ url_for('dashboard') }}"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </p>
    </div>
</div>
{% endblock %}
