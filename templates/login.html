{% extends "base.html" %}

{% block title %}Login - LearnMate{% endblock %}

{% block content %}
<div class="container">
    <div class="form-container">
        <h2><i class="fas fa-sign-in-alt"></i> Login to LearnMate</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 5px;">
            <p style="margin: 0; text-align: center;"><strong>Demo Credentials:</strong></p>
            <p style="margin: 5px 0; text-align: center; font-size: 0.9rem;">
                Admin: <code>admin</code> / <code>admin123</code>
            </p>
        </div>
        
        <p style="text-align: center; margin-top: 20px;">
            Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
